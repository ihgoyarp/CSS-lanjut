<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Pseudo-Element</title>
    <style>
        h1::before{
            content: "* ";
            color: red;
        }

         h1::after{
            content: " +";
            color: green;
        }

        p::first-letter{
            font-size: 2em;
            font-weight: bold;
            color: darkblue;
        }

    </style>
</head>
<body>
    <h1>Belajar Pseudo-Element</h1>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque nihil necessitatibus officia, hic quaerat minima vel, fuga magni velit libero repellendus similique exercitationem, quo maxime minus doloribus nobis deleniti rerum?</p>
    
</body>
</html>
