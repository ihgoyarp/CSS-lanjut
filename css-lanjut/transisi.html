<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Transisi CSS</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }
        /* 1. Transisi warna background */
        .box1{
            width: 150px;
            height: 150px;
            background: steelblue;
            transition: background 0.5s ease;
            margin-bottom: 20px;
        }

        .box1:hover{
            background: crimson;
        }

        /* transisi ukuran dan transform */
        .box2{
            width: 150px;
            height: 150px;
            background: seagreen;
            transition: transform 0.5s ease-in-out;
            margin-bottom: 20px;
        }

        .box2:hover{
            transform: scale(1.2) rotate(10deg);
        }
        /* 3. Transisi Opacity */
        .box3{
            width: 150px;
            height: 150px;
            background: orange;
            opacity: 0.5;
            transition: opacity 0.7s linear;
            margin-bottom: 20px;
        }

        .box3:hover{
            opacity: 1;
        }

        /* 4. Transisi dengan delay */
        .box4{
            width: 150px;
            height: 150px;
            background: purple;
            transition: background 0.5s ease-in-out 0.5s;
            /* margin-bottom: 20px; */
        }

        .box4:hover{
            background: gold;
        }
    </style>
</head>
<body>
    <h1>Demo CSS Transisi</h1>

    <h2>1. Transisi Warna Background</h2>
    <div class="box1"></div>

    <h2>2. Transisi Ukuran dan Transform</h2>
    <div class="box2"></div>

    <h2>3. Transisi Opacity </h2>
    <div class="box3"></div>

    <h2>4. Transisi dengan Delay</h2>
    <div class="box4"></div>
    
</body>
</html>
